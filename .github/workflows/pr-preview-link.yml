name: PR preview link

# Adds the preview URL to a freshly opened PR (later pushes update it from the CI deploy job).
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve preview URL
        id: url
        run: node scripts/cf-deploy.mjs --env preview --url-only
      - name: Comment
        if: steps.url.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const { upsertPreviewComment } = require('./scripts/pr-preview-comment.cjs');
            await upsertPreviewComment({ github, context, url: process.env.PREVIEW_URL });
