name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Bundle size budget
        run: pnpm size
      - name: Worker bundle (wrangler dry run)
        run: node scripts/cf-deploy.mjs --env production --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: Playwright smoke (mobile)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Smoke tests
        run: pnpm e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          retention-days: 7

  deploy:
    name: Deploy (Cloudflare)
    needs: [check, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
      - name: Deploy
        id: deploy
        run: node scripts/cf-deploy.mjs --env ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      - name: Record GitHub deployment (link on the repo page)
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: dep } = await github.rest.repos.createDeployment({
              owner, repo, ref: context.sha, environment: process.env.DEPLOY_ENV,
              auto_merge: false, required_contexts: [], transient_environment: process.env.DEPLOY_ENV !== 'production',
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: dep.id, state: 'success', environment_url: process.env.DEPLOY_URL,
            });
      - name: Comment preview link on the PR
        if: steps.deploy.outputs.url != '' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { upsertPreviewComment } = require('./scripts/pr-preview-comment.cjs');
            await upsertPreviewComment({ github, context, url: process.env.PREVIEW_URL });
